services:
  - type: web
    name: beauty-mirror-api
    runtime: docker
    rootDir: backend
    healthCheckPath: /api/health
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: SECRET_KEY
        generateValue: true
      - key: ROI_FEATURE_BUDGET_MS
        value: 500
      - key: ROI_FEATURE_MAX_SIDE
        value: 180
      - key: GEMINI_TIMEOUT_MS
        value: 30000
      - key: SKIN_ANALYSIS_HEATMAP_MAX_START_MS
        value: 45000
